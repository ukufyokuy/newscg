<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="/tmp/newscg-fonts/package/500.css">
<link rel="stylesheet" href="/tmp/newscg-fonts/package/700.css">
<link rel="stylesheet" href="/tmp/newscg-fonts/package/900.css">
<style>
  html,body{margin:0;padding:0}
  body{width:1920px;height:1080px;overflow:hidden;font-family:'Noto Sans TC',sans-serif;background:#13294a}
  #stage{position:relative;width:1920px;height:1080px}
  svg{position:absolute;left:0;top:0}
  .t{position:absolute;color:#f6efe6;white-space:nowrap;will-change:clip-path,transform}
</style></head><body><div id="stage">
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2140"/><stop offset=".55" stop-color="#1c3a63"/><stop offset="1" stop-color="#2a4a73"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".42" r=".55">
      <stop offset="0" stop-color="#ff9a6b" stop-opacity=".22"/><stop offset="1" stop-color="#ff9a6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d6c3"/><stop offset="1" stop-color="#b9a688"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#e2533b"/>
    </linearGradient>
    <linearGradient id="cityTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a31" stop-opacity=".9"/><stop offset="1" stop-color="#0b1a31" stop-opacity="0"/>
    </linearGradient>
    <mask id="arrowMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <path id="arrowMaskPath" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="216" fill="url(#cityTop)" opacity=".45"/>
  <g id="towers"></g>
  <g id="city"></g>
  <g id="chart"></g>
  <g id="icons" fill="none" stroke="#f6efe6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></g>
</svg>
<div class="t c" id="title1" style="left:200px;top:236px;font-size:52px;font-weight:700;letter-spacing:2px">台灣35到39歲人口</div>
<div class="t c" id="title2" style="left:196px;top:300px;font-size:124px;font-weight:900;color:#ffb48f;letter-spacing:6px;line-height:1.15">未婚比例</div>
<div class="t c" id="cap1" style="left:200px;top:690px;font-size:30px;font-weight:500;color:#e9dccb;line-height:1.45">結婚率大幅下降</div>
<div class="t c" id="cap2" style="left:200px;top:733px;font-size:30px;font-weight:500;color:#e9dccb;line-height:1.45">也是生育率低迷的重要前導因素</div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(p,tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function txt(p,s,a){const e=el(p,'text',Object.assign({'font-family':'Noto Sans TC'},a));e.textContent=s;return e}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

// ===== 背景（第 1 格就完整，不做動畫）=====
const city=document.getElementById('city');
el(city,'rect',{x:0,y:960,width:1920,height:120,fill:'#0b1830'});
for(let layer=0;layer<2;layer++){
  let x=-20;
  while(x<1940){
    const w=60+rnd()*90, h=(layer?110:140)+rnd()*(layer?80:110);
    const top=1080-h-(layer?0:30);
    const b=el(city,'g',{});
    el(b,'rect',{x,y:top,width:w,height:h+40,fill:layer?'#0f2342':'#1a3254',opacity:layer?1:.8});
    for(let wy=top+16;wy<1060;wy+=26)for(let wx=x+10;wx<x+w-14;wx+=20)
      if(rnd()<(layer?.22:.12)) el(b,'rect',{x:wx,y:wy,width:9,height:12,fill:'#ffcf8a',opacity:layer?.55:.3});
    x+=w+(layer?4:10);
  }
}
const tw=document.getElementById('towers');
seed=99;
[[18,150],[1752,150]].forEach(([x,w],i)=>{
  const top=i?40:70;
  el(tw,'rect',{x,y:top,width:w,height:1080-top,fill:'#11264a'});
  el(tw,'rect',{x:x+(i?0:w-6),y:top,width:6,height:1080-top,fill:'#2d4d7a',opacity:.6});
  el(tw,'rect',{x:x+w*.35,y:top-26,width:w*.3,height:26,fill:'#11264a'});
  for(let wy=top+20;wy<1060;wy+=30)for(let wx=x+16;wx<x+w-20;wx+=26)
    if(rnd()<.18) el(tw,'rect',{x:wx,y:wy,width:11,height:14,fill:'#ffcf8a',opacity:.4});
});

// ===== 圖表 =====
const chart=document.getElementById('chart');
const BASE=712, HMAX=330, VMAX=41.4, BW=176;
const axis=el(chart,'line',{x1:960,y1:BASE,x2:960,y2:BASE,stroke:'#9fb3cf','stroke-width':3,opacity:.7});
const bars=[{y:'1975年',v:5.3,cx:1080,fill:'url(#barA)',lab:'#efe4d4',fs:64},
            {y:'2024年',v:41.4,cx:1530,fill:'url(#barB)',lab:'#ffb48f',fs:96}].map(d=>{
  d.rect=el(chart,'rect',{x:d.cx-BW/2,y:BASE,width:BW,height:0,rx:10,fill:d.fill,class:'c'});
  d.foot=el(chart,'rect',{x:d.cx-BW/2,y:BASE-10,width:BW,height:10,fill:d.fill});
  d.num=txt(chart,'',{x:d.cx+8,y:BASE,'text-anchor':'middle',fill:d.lab,'font-weight':900,'font-size':d.fs,class:'c'});
  d.numMain=el(d.num,'tspan',{});
  d.numPct=el(d.num,'tspan',{'font-size':d.fs*0.45,dx:4});d.numPct.textContent='%';
  d.year=el(chart,'g',{});
  txt(d.year,d.y,{x:0,y:0,'text-anchor':'middle',fill:'#f6efe6','font-weight':700,'font-size':36,class:'c'});
  return d;
});
const top0=BASE-HMAX*5.3/VMAX, top1=BASE-HMAX;
const arrowD=`M ${1080+BW/2+14} ${top0-6} C 1260 ${top0-40}, 1300 ${top1+150}, ${1530-BW/2-20} ${top1+40}`;
const arrowG=el(chart,'g',{mask:'url(#arrowMask)'});
el(arrowG,'path',{d:arrowD,fill:'none',stroke:'#ffd27a','stroke-width':7,'stroke-dasharray':'2 16','stroke-linecap':'round'});
const mp=document.getElementById('arrowMaskPath');mp.setAttribute('d',arrowD);
const AL=mp.getTotalLength();
// 箭頭頭（沿路徑終點方向）
const pe=mp.getPointAtLength(AL), pb=mp.getPointAtLength(AL-12);
const ang=Math.atan2(pe.y-pb.y,pe.x-pb.x)*180/Math.PI;
const head=el(chart,'g',{});
const headInner=el(head,'path',{d:'M-14,-16 L20,0 L-14,16 z',fill:'#ffd27a'});
const badge=el(chart,'g',{class:'c'});
const badgeInner=el(badge,'g',{});
el(badgeInner,'rect',{x:-150,y:-56,width:300,height:108,rx:54,fill:'#ffd27a'});
const bt=txt(badgeInner,'',{x:0,y:24,'text-anchor':'middle',fill:'#13294a','font-weight':900,'font-size':40});
el(bt,'tspan',{}).textContent='提高將近';
el(bt,'tspan',{'font-size':64,dx:2}).textContent='8';
el(bt,'tspan',{dx:2}).textContent='倍';

// ===== 小插圖 =====
const ic=document.getElementById('icons');
const IY=548;
function icon(cx,dy,lab){
  const outer=el(ic,'g',{}); const g=el(outer,'g',{});
  const inner=el(g,'g',{transform:`translate(0,${dy})`});
  if(lab) txt(g,lab,{x:0,y:658-IY,'text-anchor':'middle',fill:'#e9dccb',stroke:'none','font-weight':700,'font-size':28,class:'c'});
  return {cx,outer,g:inner,wrap:g};
}
const IC={};
let o=icon(256,0,'高房價');IC.house=o;
el(o.g,'path',{d:'M-46,4 L0,-40 L46,4 M-34,-6 V44 H34 V-6'});
el(o.g,'path',{d:'M-10,44 V18 H10 V44'});
el(o.g,'path',{d:'M28,-30 l18,-18 h22 v22 l-18,18 z',stroke:'#ff8a5c'});
el(o.g,'circle',{cx:58,cy:-38,r:3,fill:'#ff8a5c',stroke:'none'});
o=icon(410,0,'低薪資');IC.wallet=o;
el(o.g,'rect',{x:-46,y:-26,width:92,height:66,rx:10});
el(o.g,'path',{d:'M-46,-10 H46'});
el(o.g,'rect',{x:16,y:2,width:30,height:22,rx:6,stroke:'#ff8a5c'});
el(o.g,'path',{d:'M-30,-26 L10,-44 L22,-26',stroke:'#ff8a5c'});
o=icon(500,0,null);IC.arr1=o;
el(o.g,'path',{d:'M-20,0 H20 m-14,-14 l14,14 l-14,14',stroke:'#ffd27a'});
o=icon(596,6,'不敢結婚');IC.rings=o;
el(o.g,'circle',{cx:-20,cy:6,r:28});
el(o.g,'circle',{cx:26,cy:6,r:28,stroke:'#ff8a5c'});
el(o.g,'path',{d:'M-20,-22 l-10,-14 h20 z',fill:'#f6efe6'});
o.wrap.querySelector('text').setAttribute('y',658-IY);
o=icon(688,0,null);IC.arr2=o;
el(o.g,'path',{d:'M-20,0 H20 m-14,-14 l14,14 l-14,14',stroke:'#ffd27a'});
o=icon(786,0,'生育率低迷');IC.stroller=o;
el(o.g,'path',{d:'M-44,-6 H34 A40,40 0 0 1 -44,-6 Z'});
el(o.g,'path',{d:'M-4,-6 V-44 A40,40 0 0 1 36,-6',stroke:'#ff8a5c'});
el(o.g,'path',{d:'M34,-6 L50,-34 H60'});
el(o.g,'circle',{cx:-26,cy:40,r:9});el(o.g,'circle',{cx:22,cy:40,r:9});

// ===== 時間軸（秒）=====
const clamp=(x)=>Math.max(0,Math.min(1,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const eOut=(u)=>1-Math.pow(1-u,3);
const eIO=(u)=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const ePop=(u)=>{ if(u<=0) return 0; if(u>=1) return 1; const c=1.4; return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2); }; // 輕微回彈 ~6%
const T={title1:.3,title2:.7, house:1.6,wallet:2.0,arr1:2.4,rings:2.7,
         axis:3.4, bar0:3.8, bar1:5.0, arrow:7.4, badge:8.2,
         arr2:9.2, stroller:9.5, cap1:10.1, cap2:10.6, END:14.0};
function wipe(id,t,a,d){
  const u=eOut(prog(t,a,d)); const e=document.getElementById(id);
  e.style.clipPath=`inset(-20px ${100-u*100}% -20px -20px)`;
  e.style.transform=`translateX(${(1-u)*-30}px)`;
  e.style.visibility=u>0?'visible':'hidden';
}
function pop(o,t,a,d=.45){
  const s=ePop(prog(t,a,d));
  o.outer.setAttribute('transform',`translate(${o.cx},${IY})`);
  o.wrap.setAttribute('transform',`scale(${Math.max(s,0.0001)})`);
  o.wrap.style.visibility=s>0?'visible':'hidden';
}
window.render=function(t){
  wipe('title1',t,T.title1,.6); wipe('title2',t,T.title2,.7);
  pop(IC.house,t,T.house); pop(IC.wallet,t,T.wallet); pop(IC.arr1,t,T.arr1,.35);
  pop(IC.rings,t,T.rings); pop(IC.arr2,t,T.arr2,.35); pop(IC.stroller,t,T.stroller);
  // 底線往右畫出
  const ua=eIO(prog(t,T.axis,.6)); axis.setAttribute('x2',960+740*ua); axis.style.visibility=ua>0?'visible':'hidden';
  // 長條＋跑數字（同一條緩動，數字跟著柱頂）
  [[bars[0],T.bar0,1.2],[bars[1],T.bar1,2.0]].forEach(([d,a,dur])=>{
    const u=prog(t,a,dur), k=1-Math.pow(1-u,3);
    const v=d.v*k, h=HMAX*v/VMAX, top=BASE-h;
    d.rect.setAttribute('y',top); d.rect.setAttribute('height',h);
    d.rect.style.visibility=h>0.5?'visible':'hidden';
    d.foot.style.visibility=h>10?'visible':'hidden';
    d.foot.setAttribute('height',Math.min(10,h));
    d.num.setAttribute('y',top-18);
    const show=v>=0.05; d.num.style.visibility=show?'visible':'hidden';
    d.numMain.textContent=show?v.toFixed(1):'';
    const ys=ePop(prog(t,a,.45));
    d.year.setAttribute('transform',`translate(${d.cx},${BASE+48}) scale(${Math.max(ys,1e-4)})`);
    d.year.style.visibility=ys>0?'visible':'hidden';
  });
  // 虛線箭頭畫出，結束時箭頭頭彈出
  const ur=eIO(prog(t,T.arrow,.8));
  mp.setAttribute('stroke-dasharray',`${AL*ur} ${AL+10}`);
  mp.style.visibility=ur>0?'visible':'hidden';
  const hs=ePop(prog(t,T.arrow+.7,.3));
  head.setAttribute('transform',`translate(${pe.x},${pe.y}) rotate(${ang}) scale(${Math.max(hs,1e-4)})`);
  head.style.visibility=hs>0?'visible':'hidden';
  const bs=ePop(prog(t,T.badge,.5));
  badge.setAttribute('transform',`translate(1292,520) scale(${Math.max(bs,1e-4)})`);
  badge.style.visibility=bs>0?'visible':'hidden';
  wipe('cap1',t,T.cap1,.6); wipe('cap2',t,T.cap2,.8);
};
window.DURATION=T.END;
render(0);
</script>
</body></html>
